version: '3.8'

services:
  postgresdb:
    image: postgres:16
    container_name: hospital_db
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: hospital_backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgresdb:5432/hospital
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    depends_on:
      - postgresdb
    restart: always

volumes:
  postgres_data: